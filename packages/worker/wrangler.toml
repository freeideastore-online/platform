name = "freeideastore"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true

[[routes]]
pattern = "freeideastore.online"
zone_name = "freeideastore.online"
custom_domain = true

# FIS's own OAuth client ids. Public by design — they travel in every redirect
# URL — so they belong here rather than in the secret store. The matching
# secrets are Worker secrets, placed with `ops put fis <KEY>`.
# See freeideastore-online/platform#39.
[vars]
GH_OAUTH_CLIENT_ID = "Ov23linw5p50f2c1onYZ"
GOOGLE_CLIENT_ID = "236968108464-6ogtss96ht1f49odbadv5psvonanas0f.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "freeideastore"
database_id = "6c8cefe4-f170-45fd-9979-ebef9068e1aa"

# Nightly source link check (see scheduled() in src/index.ts).
[triggers]
crons = ["17 18 * * *"]

# Canonical idea bodies live here so a document is not limited to what fits in a
# D1 column value. `ideaBody()` prefers body_key and falls back to body_md, so
# rows written before this binding existed keep working.
[[r2_buckets]]
binding = "IDEA_BUCKET"
bucket_name = "freeideastore-ideas"

[assets]
directory = "../../store"
binding = "ASSETS"
run_worker_first = true
