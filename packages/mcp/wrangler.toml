name = "freeideastore-mcp"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "mcp.freeideastore.online"
zone_name = "freeideastore.online"
custom_domain = true

[vars]
GITHUB_ORG = "freeideastore-online"
PLATFORM_REPO = "platform"
PUBLIC_BASE = "https://freeideastore.online"
FIS_API_BASE = "https://freeideastore.online"
FIS_AUTH_BASE = "https://freeideastore.online"
MCP_ISSUER = "https://mcp.freeideastore.online"

# Secrets:
#   GITHUB_TOKEN - optional PAT for future pro-book export tooling.
#   SESSION_SIGNING_KEY - FreeIdeaStore's own HMAC key, the same value the
#     freeideastore worker signs sessions with. Both workers must hold it: the
#     site mints the session, this worker verifies it and mints the one behind
#     each MCP access token.

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "FisMcp" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FisMcp"]
